<!doctype html><meta charset="utf-8"><title>選択要約テスト</title>
<body style="font:16px sans-serif;padding:24px"><p>選択した文章の要約と調整ボタンを確認します。</p><output id="results"></output>
<script src="/src/content/ui.js"></script>
<script src="/src/content/streaming.js"></script>
<script src="/src/content/selection.js"></script>
<script>
let pending, messages = [];
window.safeSendMessage = () => {};
window.LLMT.messaging = { sendBackgroundMessage: (action, payload) => {
  messages.push({action, ...payload});
  if (action === 'startSummaryStream') return Promise.resolve({ok:true,data:{accepted:true,conversationId:'summary-conversation'}});
  if (action === 'continueSelectionConversation') return Promise.resolve({ok:true,data:{accepted:true}});
  return new Promise(resolve => pending = resolve);
}};
const check = (condition, label) => {
 if (!condition) throw new Error(label);
 document.querySelector('#results').append(document.createTextNode('PASS: ' + label + '\n'));
};
const tick = () => new Promise(resolve => requestAnimationFrame(resolve));
const requestId = () => messages.at(-1).requestId;
const finish = summary => completeStreamSession(requestId(), summary);
const delta = async text => {
 appendStreamSessionDelta(requestId(), text);
 await new Promise(resolve => setTimeout(resolve, 70));
};
(async () => {
 showSelectionSummary('原文の結論と根拠です。');
 let popup = document.querySelector('[role=dialog]');
 const button = label => [...popup.querySelectorAll('button')].find(b => b.textContent === label);
 check(button('短く').disabled, '処理中は調整不可');
 await delta('最初の');
 check(popup.textContent.includes('最初の') && button('短く').disabled, '完了前から表示');
 finish('最初の要約'); await tick();
 check(popup.textContent.includes('最初の要約'), '初回要約を表示');
 check(!popup.querySelector('textarea').disabled, '開始応答の後に完了しても追加指示を入力できる');
 button('長く').click();
 check(messages[1].currentSummary === '最初の要約' && messages[1].text === '原文の結論と根拠です。', '原文と現在の要約を引き継ぐ');
 check(popup.textContent.includes('最初の要約'), '調整中も結果を維持');
 await delta('調整途中');
 check(popup.textContent.includes('調整途中') && button('コピー').disabled, '調整も途中表示し未確定のコピーを防ぐ');
 failStreamSession(requestId(), {message:'通信失敗'}); await tick();
 check(popup.textContent.includes('最初の要約') && !button('再試行').hidden, '失敗時に結果を維持し再試行できる');
 button('再試行').click(); check(messages[2].adjustment === 'longer', '同じ調整を再試行');
 finish('詳しい要約と根拠'); await tick();
 button('短く').click(); check(messages[3].currentSummary === '詳しい要約と根拠', '最新の要約から短くする');
 removePopup(); finish('遅延応答'); await tick();
 check(!document.querySelector('[role=dialog]'), '閉じた後に応答しても復活しない');
  showSelectionSummary('表示確認用の原文'); finish('要約結果の表示例です。\n重要な結論を簡潔にまとめ、「短く」「長く」で調整できます。'); await tick();
  popup = document.querySelector('[role=dialog]');
  const input = popup.querySelector('textarea');
  const submit = popup.querySelector('[type=submit]');
  check(input && !input.disabled && submit.disabled, '初回要約完了で追加指示を入力でき、空入力は送信不可');
  input.value = 'もっと詳しく説明してください';
  input.dispatchEvent(new Event('input'));
  popup.querySelector('form').requestSubmit();
  const followupId = messages.at(-1).requestId;
  check(messages.at(-1).action === 'continueSelectionConversation' && messages.at(-1).conversationId === 'summary-conversation', '追加指示を会話IDで送信');
  check(input.disabled, '送信中の二重送信を防止');
  check(button('短く').disabled && button('長く').disabled && button('コピー').disabled, '追加指示中は調整とコピーを無効化');
  const beforeConcurrent = messages.length;
  button('短く').onclick();
  popup.querySelector('form').requestSubmit();
  check(messages.length === beforeConcurrent, '実行入口でも調整と追加指示の並行実行を防止');
  await delta('詳しい途中');
  check(popup.__contentEl.textContent === '詳しい途中', '回答を途中から表示');
  completeStreamSession(followupId, '詳しい要約です。'); await tick();
  check(input.value === '' && popup.querySelectorAll('details').length === 1 && popup.__titleEl.textContent === '要約の会話', '成功で履歴を追加しタイトルを更新');
  check(!button('短く').disabled && !button('コピー').disabled && !input.disabled, '追加指示の完了で操作を復帰');
  input.value = '入力中の次の指示'; input.dispatchEvent(new Event('input'));
  const observer = popup.__resizeObserver;
  button('短く').click();
  check(messages.at(-1).currentSummary === '詳しい要約です。', '追加指示の最新回答から長さ調整');
  check(input.disabled && submit.disabled, '調整開始直後から追加指示を無効化');
  const beforeAdjustmentSubmit = messages.length;
  popup.querySelector('form').requestSubmit();
  check(messages.length === beforeAdjustmentSubmit, '調整中の追加指示を実行入口でも防止');
  await tick();
  check(popup.querySelector('textarea') === input && popup.__resizeObserver === observer, '同じ会話ではフォームと監視を再利用');
  failStreamSession(requestId(), {message:'調整失敗'}); await tick();
  check(popup.__contentEl.textContent === '詳しい要約です。' && popup.__renderedText === '詳しい要約です。', '調整失敗時は最新回答を復元');
  check(!input.disabled && input.value === '入力中の次の指示', '調整失敗後も入力途中の追加指示を保持');
  button('再試行').click(); finish('短い要約です。'); await tick();
  check(!input.disabled && popup.querySelectorAll('form').length === 1 && popup.querySelectorAll('details').length === 1, '調整再試行後もフォームと履歴を保持');
  popup.querySelector('form').requestSubmit(); await tick();
  failStreamSession(requestId(), {message:'追加指示失敗'}); await tick();
  check(popup.__contentEl.textContent === '短い要約です。' && !input.disabled && !button('長く').disabled, '追加指示の失敗でも最新回答と操作を復元');
  const rect = popup.getBoundingClientRect();
  check(rect.left >= 0 && rect.right <= innerWidth, '画面幅に収まる');
  showSelectionSummary('初回失敗の原文');
  failStreamSession(requestId(), {message:'初回失敗'}); await tick();
  popup = document.querySelector('[role=dialog]');
  check(popup.querySelector('textarea').disabled && button('コピー').disabled && button('短く').disabled, '開始応答より先に初回失敗しても未確定の操作は無効');
  button('再試行').click(); await tick(); finish('再試行の要約'); await tick();
  check(!popup.querySelector('textarea').disabled && !button('短く').disabled, '初回失敗の再試行成功で操作を復帰');
  document.title = 'PASS 選択要約テスト';
})().catch(error => { document.title = 'FAIL'; document.querySelector('#results').textContent += error.stack; });
</script>
