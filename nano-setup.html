<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Nano の準備 — LLM翻訳</title>
  <style>
    body { font: 16px/1.7 system-ui, sans-serif; color: #172033; background: #f5f7fb; margin: 0; padding: 40px 20px; }
    main { max-width: 640px; margin: auto; background: white; padding: 32px; border-radius: 16px; }
    h1 { font-size: 24px; margin-top: 0; }
    .form-group { padding: 12px 0 24px; border-bottom: 1px solid #dde3ee; margin-bottom: 16px; }
    button { padding: 10px 16px; border: 1px solid #bdc8da; border-radius: 8px; background: #eef3ff; color: #203859; cursor: pointer; font: inherit; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    progress { width: 100%; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Gemini Nano の準備</h1>
    <p>初回は Chrome がモデルをダウンロードします。通信量と時間がかかる場合があります。準備が完了するまで、このタブを開いておいてください。</p>
    <div id="nano-preparation"></div>
    <p>「利用可能」になったら、元のページで翻訳を実行できます。画像翻訳を使う場合は画像の状態も確認してください。</p>
  </main>
  <script type="module" src="src/popup/nano-setup.js"></script>
</body>
</html>
